<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 游戏</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loading-screen" class="loading-screen">
<div class="loading-content">
<h1 class="loading-title">2048</h1>
<p class="loading-subtitle">数字益智游戏</p>
<div class="loading-tiles">
<div class="loading-tile"></div>
<div class="loading-tile"></div>
<div class="loading-tile"></div>
<div class="loading-tile"></div>
</div>
<div class="loading-bar"><div class="loading-bar-fill" style="width:0%"></div></div>
<p class="loading-text">加载中...</p>
</div>
</div>
<div id="game-container" class="game-container hidden">
<nav class="nav-bar">
<div class="nav-left"><span class="nav-title">2048</span></div>
<div class="nav-right">
<button id="leaderboard-btn" class="nav-btn" title="排行榜"><span class="nav-icon">🏆</span><span class="nav-text">排行榜</span></button>
<button id="achievements-btn" class="nav-btn" title="成就"><span class="nav-icon">🎯</span><span class="nav-text">成就</span></button>
<button id="settings-btn" class="nav-btn" title="设置"><span class="nav-icon">⚙️</span><span class="nav-text">设置</span></button>
<button id="resume-btn" class="nav-btn" title="个人简历"><span class="nav-icon resume-icon"><img src="../3.png" alt="简历" class="resume-img"></span><span class="nav-text">个人简历</span></button>
<span id="connection-status" class="connection-status">⚪ 本地模式</span>
<div id="user-area" class="user-area">
<button id="user-btn" class="nav-btn user-btn" title="用户">
<img src="../3.png" alt="用户" class="user-avatar-img">
</button>
<div id="user-panel" class="user-panel hidden">
<div id="user-info" class="user-info hidden">
<div class="user-avatar-large" id="user-avatar-large">👤</div>
<div class="user-details">
<h4 id="user-nickname">用户</h4>
<p id="user-stats">游戏: 0 | 最高分: 0</p>
</div>
<div class="user-actions">
<button id="logout-btn" class="btn btn-small">退出登录</button>
<button id="switch-account-btn" class="btn btn-small btn-secondary">切换账号</button>
</div>
</div>
<div id="auth-forms" class="auth-forms">
<div id="login-form" class="auth-form">
<button id="login-close" class="close-btn" title="关闭">×</button>
<h3>登录</h3>
<input type="text" id="login-username" class="text-input" placeholder="用户名" />
<input type="password" id="login-password" class="text-input" placeholder="密码" />
<div class="form-buttons">
<button id="login-submit" class="btn">登录</button>
<button id="show-register" class="btn btn-secondary">注册</button>
</div>
</div>
<div id="register-form" class="auth-form hidden">
<h3>注册</h3>
<input type="text" id="register-username" class="text-input" placeholder="用户名 (3-20字符)" />
<input type="password" id="register-password" class="text-input" placeholder="密码 (至少6位)" />
<input type="text" id="register-nickname" class="text-input" placeholder="昵称 (可选)" />
<input type="text" id="register-avatar" class="text-input" placeholder="头像 (可选，如 🎮 🐱 🚀)" />
<div class="avatar-selector">
    <span class="avatar-label">选择头像:</span>
    <div class="avatar-options">
        <button class="avatar-option" data-avatar="custom" title="用户"><img src="../3.png" alt="用户" class="avatar-img"></button>
        <button class="avatar-option" data-avatar="🎮" title="游戏">🎮</button>
        <button class="avatar-option" data-avatar="🐱" title="猫咪">🐱</button>
        <button class="avatar-option" data-avatar="🚀" title="火箭">🚀</button>
        <button class="avatar-option" data-avatar="⭐" title="星星">⭐</button>
        <button class="avatar-option" data-avatar="🎯" title="目标">🎯</button>
        <button class="avatar-option" data-avatar="🏆" title="奖杯">🏆</button>
        <button class="avatar-option" data-avatar="💎" title="钻石">💎</button>
    </div>
</div>
<div class="form-buttons">
<button id="register-submit" class="btn">注册</button>
<button id="show-login" class="btn btn-secondary">返回登录</button>
</div>
</div>
</div>
</div>
</div>
</div>
</nav>
<div class="container">
<header>
<h1 class="title">2048</h1>
<div class="score-container">
<div class="score-box"><span class="score-label">分数</span><span id="score" class="score-value">0</span></div>
<div class="score-box best"><span class="score-label">最高分</span><span id="best-score" class="score-value">0</span></div>
</div>
</header>
<div class="game-info">
<div class="info-left">
<span id="difficulty-display">普通</span>
<span id="timer-display">00:00</span>
<span id="move-count">0 步</span>
</div>
<div class="info-right">
<button class="btn btn-small" onclick="gameApp.togglePause()">暂停</button>
<button id="new-game" class="btn btn-small">新游戏</button>
</div>
</div>
<div id="game-board" class="game-board"></div>
<div id="game-over" class="game-over hidden">
<div class="game-over-content">
<h2>游戏结束!</h2>
<p>最终得分: <span id="final-score">0</span></p>
<div class="game-over-buttons">
<button id="restart" class="btn">再来一局</button>
<button id="share-btn" class="btn btn-secondary">分享成绩</button>
</div>
</div>
</div>
<div id="win-message" class="win-message hidden">
<div class="win-content">
<h2>🎉 恭喜!</h2>
<p>你达到了目标分数!</p>
<div class="win-buttons">
<button id="continue" class="btn">继续游戏</button>
<button id="restart-win" class="btn">重新开始</button>
</div>
</div>
</div>
<div id="pause-overlay" class="pause-overlay hidden">
<div class="pause-content">
<h2>游戏暂停</h2>
<button id="continue-game" class="btn">继续游戏</button>
<button class="btn btn-secondary" onclick="gameApp.newGame()">重新开始</button>
<button id="pause-resume-btn" class="btn btn-secondary">查看简历</button>
</div>
</div>
</div>
</div>
<div id="settings-panel" class="panel hidden">
<div class="panel-content">
<h3>游戏设置</h3>
<div class="setting-group"><label>难度选择</label><select id="difficulty-select" class="select"><option value="easy">简单 (3x3)</option><option value="normal" selected>普通 (4x4)</option><option value="hard">困难 (5x5)</option></select></div>
<div class="setting-group"><label>主题</label><select id="theme-select" class="select"><option value="classic" selected>经典</option><option value="dark">深色</option><option value="forest">森林</option></select></div>
<div class="setting-group"><label>皮肤</label><div id="skin-options" class="skin-options">
    <button class="skin-option" data-skin="classic" title="经典皮肤"><span class="skin-preview skin-preview-classic"></span><span class="skin-name">经典</span></button>
    <button class="skin-option" data-skin="dark" title="深色皮肤"><span class="skin-preview skin-preview-dark"></span><span class="skin-name">深色</span></button>
    <button class="skin-option" data-skin="forest" title="森林皮肤"><span class="skin-preview skin-preview-forest"></span><span class="skin-name">森林</span></button>
    <button class="skin-option" data-skin="jialu1" title="伽罗-蓄势"><img src="../4.jpg" alt="伽罗-蓄势" class="skin-preview-img"><span class="skin-name">伽罗-蓄势</span></button>
    <button class="skin-option" data-skin="jialu2" title="伽罗-独处"><img src="../5.jpg" alt="伽罗-独处" class="skin-preview-img"><span class="skin-name">伽罗-独处</span></button>
</div></div>
<div class="setting-group"><label>音量控制</label><div class="volume-control"><button id="mute-btn" class="btn-icon">🔊</button><input type="range" id="volume-slider" class="slider" min="0" max="1" step="0.1" value="0.5"></div></div>
<div class="setting-group"><button id="reset-tutorial-btn" class="btn btn-secondary">重置操作引导</button></div>
<button id="close-settings" class="btn">关闭</button>
</div>
</div>
<div id="leaderboard-panel" class="panel hidden">
<div class="panel-content">
<h3>🏆 排行榜</h3>
<div id="connection-note" class="connection-note hidden">🌐 显示全服排行榜</div>
<div id="leaderboard-list" class="leaderboard-list"></div>
<div class="panel-buttons">
<button id="sort-leaderboard" class="btn btn-small">切换排序</button>
<button id="clear-leaderboard" class="btn btn-small btn-danger">清空记录</button>
<button id="refresh-leaderboard" class="btn btn-small">刷新</button>
<button id="close-leaderboard" class="btn btn-small">关闭</button>
</div>
</div>
</div>
<div id="achievements-panel" class="panel hidden">
<div class="panel-content">
<h3>🎯 成就</h3>
<div id="achievements-list" class="achievements-list"></div>
<button id="close-achievements" class="btn">关闭</button>
</div>
</div>
<div id="share-panel" class="panel hidden">
<div class="panel-content">
<h3>分享成绩</h3>
<div class="share-info"><p>分数: <span id="share-score">0</span></p><p>难度: <span id="share-difficulty">普通</span></p><p>用时: <span id="share-time">0</span>秒</p></div>
<div class="panel-buttons"><button id="copy-text" class="btn">复制文本</button><button id="download-image" class="btn">下载图片</button><button id="close-share" class="btn btn-secondary">关闭</button></div>
</div>
</div>
<div id="nickname-dialog" class="dialog hidden">
<div class="dialog-content">
<h3>记录成绩</h3>
<p>请输入你的昵称：</p>
<input type="text" id="nickname-input" class="text-input" placeholder="匿名玩家" maxlength="20">
<div class="dialog-buttons"><button id="confirm-nickname" class="btn">确认</button><button id="skip-nickname" class="btn btn-secondary">跳过</button></div>
</div>
</div>
<div id="tutorial-overlay" class="tutorial-overlay hidden">
<div class="tutorial-content">
<h3>🎮 游戏操作</h3>
<div class="tutorial-steps">
<div class="tutorial-step"><span class="step-icon">⌨️</span><p>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 移动方块</p></div>
<div class="tutorial-step"><span class="step-icon">👆</span><p>在手机上 <strong>滑动屏幕</strong> 移动方块</p></div>
<div class="tutorial-step"><span class="step-icon">🎯</span><p>相同数字碰撞合并，达到目标分数即可获胜</p></div>
</div>
<div class="tutorial-options"><label><input type="checkbox" id="dont-show-tutorial"> 不再提示</label></div>
<button id="close-tutorial" class="btn">开始游戏</button>
</div>
</div>
<div id="achievement-toast" class="achievement-toast hidden">
<div class="toast-content"><span class="toast-icon">🏆</span><div class="toast-text"><span class="toast-title">成就解锁！</span><span class="toast-message"></span></div></div>
</div>
<script src="js/modules/StorageManager.js"></script>
    <script src="js/modules/ThemeManager.js"></script>
    <script src="js/modules/AudioManager.js"></script>
    <script src="js/modules/GameCore.js"></script>
    <script src="js/modules/GameRenderer.js"></script>
    <script src="js/modules/InputHandler.js"></script>
    <script src="js/modules/UIManager.js"></script>
    <script src="js/modules/AchievementManager.js"></script>
    <script src="js/modules/ShareManager.js"></script>
    <script src="js/modules/APIManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
